# Configuração do banco de dados H2
spring.datasource.url=jdbc:h2:file:./DATA/consertos
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Senha principal para assinar os tokens JWT (conteúdo 13).
# Lida da variável de ambiente JWT_SECRET; se ela não existir,
# usa um valor padrão para poder rodar localmente.
pw3.senha.principal.geracao.token=${JWT_SECRET:chave-local-padrao-pw3-oficina-mecanica}
